[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planner-that-remembers"
version = "0.1.0"
description = "Multi-agent financial planner with shared, governed context (Meko) and RL-based what-if planning."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # web
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # config / validation
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # database
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    # auth
    "bcrypt>=4.1",
    "python-jose[cryptography]>=3.3",
    # meko / http
    "httpx>=0.27",
    "mcp>=1.0",
    # engine
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "faker>=24.0",
    "sentence-transformers>=2.6",
    # rl
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    # charts
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true